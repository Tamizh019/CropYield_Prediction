{% extends "base.html" %}

{% block title %}Page Not Found — AgriVision{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center;">
    <div style="font-size: 6rem; margin-bottom: 24px; opacity: 0.6;">🌾</div>
    <h1 style="font-size: 6rem; font-weight: 900; letter-spacing: -0.04em; color: var(--primary-color); margin: 0; line-height: 1;">404</h1>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin: 16px 0 10px;">Page Not Found</h2>
    <p style="color: var(--muted-text); font-size: 0.95rem; max-width: 380px; line-height: 1.6; margin-bottom: 36px;">
        The page you're looking for doesn't exist or has been moved. Let's get you back on track.
    </p>
    <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--primary-color); color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: var(--transition);"
           onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
            🏠 Back to Dashboard
        </a>
        <a href="/predict_yield" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: rgba(46,204,113,0.1); color: var(--primary-color); border: 1.5px solid var(--primary-color); border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: var(--transition);"
           onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
            🌾 Predict Yield
        </a>
    </div>
</div>
{% endblock %}
